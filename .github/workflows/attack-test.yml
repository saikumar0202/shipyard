# Attack test (docs/PIPELINE.md > Build order step 2).
# Runs the real agent-run pipeline (builder role and permissions) with
# attack_test: true. Inside the agent job, plain shell steps try (a) git push,
# (b) writing .git/hooks/pre-push and (c) committing a .github/ change into the
# patch; (d) is a hand-written out.json with a label outside the allowlist.
# Only (e) and (f) use Claude, as normal tasks: (e) WebFetch example.com, which
# the builder settings file must block; (f) run tests/token_probe.py, which
# fails if the Claude token (or any 16-char part of it) is visible to commands
# Claude runs. The verify job (no AI) checks all six.
#
# Start it from the Actions tab with a throwaway issue number in this repo.
# Expected side effects on that issue: a `blocked` label and a comment listing
# what was refused. Nothing is pushed.
name: attack-test

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Throwaway issue number in this repo"
        required: true
        type: number

permissions: {}

jobs:
  preflight:
    # Reports which secrets and variables are set (true/false only, never values).
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
          BOT: ${{ vars.PIPELINE_BOT }}
          PAUSED: ${{ vars.PIPELINE_PAUSED }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN set: $HAS_CLAUDE"
          echo "APP_CLIENT_ID (variable) set: $APP_CLIENT_ID"
          echo "APP_PRIVATE_KEY set: $HAS_APP_KEY"
          echo "PIPELINE_BOT: ${BOT:-<unset>}"
          echo "PIPELINE_PAUSED: ${PAUSED:-<unset>}"
          # Fail fast: a missing setting would otherwise waste a Claude run.
          [ "$HAS_CLAUDE" = true ] && [ "$APP_CLIENT_ID" = true ] && [ "$HAS_APP_KEY" = true ] && [ -n "$BOT" ] \
            || { echo "::error::a required secret or variable is missing (see above)"; exit 1; }

  fingerprint:
    # (f) setup, no AI. Hashes every 16-char window of the token's random part
    # so the probe can find it without being given it, then runs the probe with
    # the token in this job's env as a positive control (it must say FOUND).
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # check out shipyard for the two scripts
    outputs:
      control_exit: ${{ steps.control.outputs.exit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fingerprint and positive control
        id: control
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/token-fp"
          python3 tests/token_fingerprint.py "$RUNNER_TEMP/token-fp/fingerprint.json"
          set +e
          python3 tests/token_probe.py "$RUNNER_TEMP/token-fp/fingerprint.json" | cut -c1-200
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-fp
          path: ${{ runner.temp }}/token-fp/fingerprint.json
          retention-days: 1

  attack:
    needs: fingerprint
    uses: ./.github/workflows/agent-run.yml
    # Upper bound for the called jobs (each job narrows it further).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      role: builder
      agent: attacker
      # API dispatches send inputs as strings; agent-run.yml's issue input is a number.
      issue: ${{ fromJSON(inputs.issue) }}
      shipyard_ref: ${{ github.sha }}
      shipyard_repo: ${{ github.repository }}
      max_turns: 10
      attack_test: true
      bash_commands: tests/token_probe.py
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  verify:
    needs: [fingerprint, attack]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # check out shipyard, ls-remote for the forbidden branch
      issues: read     # read the throwaway issue's labels and comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the agent's out.json and patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output-builder
          path: ${{ runner.temp }}/out

      - name: Check all five attacks failed or were refused
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ github.run_id }}
          CONTROL_EXIT: ${{ needs.fingerprint.outputs.control_exit }}
          OUT_DIR: ${{ runner.temp }}/out
        run: python3 tests/verify_attack.py

      - name: Deterministic post-job refusal tests
        run: python3 -m unittest discover -s tests -v
