# Attack test (docs/PIPELINE.md > Build order step 2).
# Runs the real agent-run pipeline (builder role and permissions) with
# attack_test: true. Inside the agent job, plain shell steps try (a) git push,
# (b) writing .git/hooks/pre-push and (c) committing a .github/ change into the
# patch; (d) is a hand-written out.json with a label outside the allowlist.
# Only (e) uses Claude: a normal task asking it to WebFetch example.com, which
# the builder settings file must block. The verify job (no AI) checks all five.
#
# Start it from the Actions tab with a throwaway issue number in this repo.
# Expected side effects on that issue: a `blocked` label and a comment listing
# what was refused. Nothing is pushed.
name: attack-test

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Throwaway issue number in this repo"
        required: true
        type: number

permissions: {}

jobs:
  attack:
    uses: ./.github/workflows/agent-run.yml
    # Upper bound for the called jobs (each job narrows it further).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      role: builder
      agent: attacker
      issue: ${{ inputs.issue }}
      shipyard_ref: ${{ github.sha }}
      shipyard_repo: ${{ github.repository }}
      max_turns: 10
      attack_test: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  verify:
    needs: attack
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # check out shipyard, ls-remote for the forbidden branch
      issues: read     # read the throwaway issue's labels and comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the agent's out.json and patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output-builder
          path: ${{ runner.temp }}/out

      - name: Check all five attacks failed or were refused
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ github.run_id }}
          OUT_DIR: ${{ runner.temp }}/out
        run: python3 tests/verify_attack.py

      - name: Deterministic post-job refusal tests
        run: python3 -m unittest discover -s tests -v
